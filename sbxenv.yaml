# Docker Sandboxes: preview with `sbx env plan`, start with `sbx env run`.
# Run without an explicit path to inherit ~/.sbxenv.yaml user defaults.
# Requires Node.js >=24 inside the sandbox. From the repository root, run:
#   npm ci
#   npm run build
#   npm -w puth run ci:browser:install
# Start the server and GUI in separate sandbox terminals:
#   npm run dev:server
#   npm run dev:client -- --host 0.0.0.0
# Run server tests with `npm -w puth run test`.
schemaVersion: "1"

name: puth

lifecycle:
  postCreate:
    - name: Allow sandbox access to puth.io
      command: sbx policy allow network --sandbox "$SBX_SANDBOX_NAME" puth.io
    - name: Allow sandbox access to puth.io
      command: sbx policy allow network --sandbox "$SBX_SANDBOX_NAME" "*.puth.io"
    - name: Set default npm configuration
      command: sbx exec "$SBX_SANDBOX_NAME" sh -c 'printf "%s\n" "ignore-scripts=true" "min-release-age=7" > "$HOME/.npmrc"'
    - name: Install Codex globally
      command: sbx exec "$SBX_SANDBOX_NAME" npm install -g "@openai/codex"

env:
  PUTH_ADDRESS: 0.0.0.0

ports:
  - sandbox: 7345
    host: 7345
  - sandbox: 5173
    host: 5173
  # Docs dev server: bind to 0.0.0.0 and use port 5174.
  - sandbox: 5174
    host: 5174
  # Spare dev server port.
  - sandbox: 5175
    host: 5175
