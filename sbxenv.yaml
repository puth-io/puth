schemaVersion: "1"

name: puth

kits:
  - ./.sbx/node24

lifecycle:
  postCreate:
    - name: Allow sandbox access to puth.io
      command: sbx policy allow network --sandbox "$SBX_SANDBOX_NAME" puth.io
    - name: Allow sandbox access to puth.io
      command: sbx policy allow network --sandbox "$SBX_SANDBOX_NAME" "*.puth.io"
    - name: Allow sandbox access to puth.dev
      command: sbx policy allow network --sandbox "$SBX_SANDBOX_NAME" puth.dev
    - name: Allow sandbox access to puth.dev
      command: sbx policy allow network --sandbox "$SBX_SANDBOX_NAME" "*.puth.dev"
    - name: Allow sandbox access to puth.dev
      command: sbx policy allow network --sandbox "$SBX_SANDBOX_NAME" deb.debian.org
    - name: Allow sandbox access to puth.dev
      command: sbx policy allow network --sandbox "$SBX_SANDBOX_NAME" deb.debian.org:80
    - name: Allow sandbox access to puth.dev
      command: sbx policy allow network --sandbox "$SBX_SANDBOX_NAME" pecl.php.net
    - name: Allow sandbox access to puth.dev
      command: sbx policy allow network --sandbox "$SBX_SANDBOX_NAME" nginx.org
    - name: Set default npm configuration
      command: sbx exec "$SBX_SANDBOX_NAME" sh -c 'printf "%s\n" "ignore-scripts=true" "min-release-age=7" > "$HOME/.npmrc"'
    - name: Install Codex globally
      command: sbx exec "$SBX_SANDBOX_NAME" npm install -g "@openai/codex"

env:
  PUTH_ADDRESS: 0.0.0.0

ports:
  - sandbox: 7345
    host: 7345
  - sandbox: 5173
    host: 5173
  # Docs dev server: bind to 0.0.0.0 and use port 5174.
  - sandbox: 5174
    host: 5174
  # Spare dev server port.
  - sandbox: 5175
    host: 5175
