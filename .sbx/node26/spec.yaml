# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Node.js 26
description: Install Node.js 26.13.0 and its bundled npm.

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - nodejs.org
          - registry.npmjs.org
          - deb.debian.org:80
          - dhi.io:80
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - description: Install Node.js 26.13.0 with SHA256 verification
          user: "0"
          command: |
            set -eu
            case "$(uname -m)" in
              x86_64)
                node_arch=x64
                node_sha256=5848553868b402d3fabb5b09270649977780a390f832155721025a08b5104455
                ;;
              aarch64|arm64)
                node_arch=arm64
                node_sha256=439e9c438acdf6a6ffe47418da709153d66c4bed812e30a473faacb107dd2791
                ;;
              *) echo "Unsupported Node.js architecture" >&2; exit 1 ;;
            esac
            # Node 26 links against libatomic, which the base image does not ship.
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libatomic1
            node_setup_dir=$(mktemp -d)
            trap 'rm -rf "$node_setup_dir"' EXIT
            curl -fsSL "https://nodejs.org/dist/v26.13.0/node-v26.13.0-linux-${node_arch}.tar.gz" -o "$node_setup_dir/node.tar.gz"
            echo "$node_sha256  $node_setup_dir/node.tar.gz" | sha256sum --check
            tar -xzf "$node_setup_dir/node.tar.gz" -C /usr/local --strip-components=1
            /usr/local/bin/node --version
            /usr/local/bin/npm --version
