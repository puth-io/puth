<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <!-- Only a frame the replay worker does not control gets this file. The worker answers frame.html itself and
         allows what it can serve; this copy allows nothing, so an uncontrolled replay can't reach the network. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
    <meta http-equiv="x-dns-prefetch-control" content="off">
</head>
<body></body>
</html>
