name: Changeset

on:
  workflow_call:
  push:
    branches:
      - master

# Each job states what it needs. Only publish may request an id token for npm's trusted publishing, so the install,
# the build and the tests never run with it. See https://changesets.dev/guide/automating#trusted-publishing.
permissions: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # A pull request opened with the default token would not start the checks of the Tests workflow.
      - uses: changesets/action/version@v2
        with:
          github-token: ${{ secrets.REPO_SCOPED_TOKEN }}

  # Publishing packed tarballs skips prepublishOnly, which ran the Node suite before puth was published. The whole
  # test workflow guards the release instead.
  test:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: [ select-mode, test ]
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Tags pushed with the default token would not start tag.yml, which builds the image and splits the PHP client.
      - uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          github-token: ${{ secrets.REPO_SCOPED_TOKEN }}
