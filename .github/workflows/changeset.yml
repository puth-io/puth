name: Changeset

# A push to master updates the "Version Packages" pull request. Publishing only
# runs after the tests passed on master, so npm releases and their tags only
# exist for tested commits. tag.yml relies on this and does not test again.
on:
  push:
    branches:
      - master
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [master]

# Separate groups, so a later push never cancels a pending publish.
concurrency: ${{ github.workflow }}-${{ github.event_name }}

jobs:
  release:
    name: ${{ github.event_name == 'workflow_run' && 'Publish' || 'Version' }}
    # Publish only for pushes to this repository: a pull request from a fork
    # branch named master also matches the branch filter.
    if: >-
      github.event_name == 'push' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
         ref: ${{ github.event.workflow_run.head_sha || github.sha }}
         token: ${{ secrets.REPO_SCOPED_TOKEN }}
         persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      # Without a publish script, changesets/action only updates the pull request.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: ${{ github.event_name == 'workflow_run' && 'npm run release' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_SCOPED_TOKEN }}
