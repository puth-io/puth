name: Changeset

# Runs after the tests passed on master, so npm releases and their tags only
# exist for tested commits. tag.yml relies on this and does not test again.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    # Only pushes to this repository: a pull request from a fork branch named
    # master also matches the branch filter.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
         ref: ${{ github.event.workflow_run.head_sha }}
         token: ${{ secrets.REPO_SCOPED_TOKEN }}
         persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_SCOPED_TOKEN }}
