name: Changeset

on:
  workflow_call:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
         token: ${{ secrets.REPO_SCOPED_TOKEN }}
         persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      # Version 2 of the action belongs to @changesets/cli 3: it reads what was published from the file in
      # CHANGESETS_OUTPUT and pushes those tags. Tags pushed with the default token would not start tag.yml.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: npm run release
          github-token: ${{ secrets.REPO_SCOPED_TOKEN }}
