name: Release

on:
  push:
    tags:
      - 'puth@*'
      - '@puth/client-php@*'
      - '@puth/client-laravel@*'

jobs:
  # PUTH ###############################################################################################################
  release-image-puth:
    if: startsWith(github.ref, 'refs/tags/puth@')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ghcr.io/puth-io/puth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # npm accepts a publish before the version can be installed, so the image
      # build waits until the registry serves it.
      - name: wait for npm release
        timeout-minutes: 180
        run: |
          version="${GITHUB_REF_NAME#puth@}"
          until [ "$(npm view "puth@$version" version 2>/dev/null)" = "$version" ]; do
            echo "Waiting for puth@$version on npm..."
            sleep 60
          done
          echo "puth@$version is available"
      - name: build image
        run: |
          docker build --file docker/Dockerfile.prod --build-arg TAG=$(echo $GITHUB_REF_NAME | cut -c6-) --tag puth-test-image .
      - name: test image
        run: |
          npm ci
          npm run build --workspace workspaces/core
          npm run build --workspace workspaces/clients/js/client
          npm run build --workspace workspaces/puth
          ./docker/test-image.sh puth-test-image
      - name: container logs
        if: ${{ failure() }}
        run: docker logs puth || true
      - name: log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push image
        id: push
        run: |
          version="${GITHUB_REF_NAME#puth@}"
          docker tag puth-test-image "$IMAGE:$version"
          docker push "$IMAGE:$version"
          # Prereleases such as 1.0.0-beta.0 do not move latest.
          if [[ "$version" != *-* ]]; then
            docker tag puth-test-image "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$version")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - name: attest image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # PHP ################################################################################################################
  release-client-php:
    if: startsWith(github.ref, 'refs/tags/@puth/client-php@')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUTH_SPLIT_PUTH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: split
        run: ./bin/php-split.sh 'workspaces/clients/php/client' php
      - name: create tag
        env:
          PUTH_SPLIT_PUTH_TOKEN: ${{ secrets.PUTH_SPLIT_PUTH_TOKEN }}
        run: ./bin/tag-release.sh $(echo $GITHUB_REF_NAME | cut -c18-) php

  # LARAVEL ############################################################################################################
  release-client-laravel:
    if: startsWith(github.ref, 'refs/tags/@puth/client-laravel@')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUTH_SPLIT_PUTH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: fix package composer.json
        run: ./bin/make-laravel-release.js version-from-package
      - name: commit release
        run: |
          git config user.email "release@puth.io"
          git config user.name "puth-release"
          git commit -am "Sync release $(echo $GITHUB_REF_NAME)"
      - name: split
        run: ./bin/php-split.sh 'workspaces/clients/php/laravel' laravel
      - name: create tag
        env:
          PUTH_SPLIT_PUTH_TOKEN: ${{ secrets.PUTH_SPLIT_PUTH_TOKEN }}
        run: ./bin/tag-release.sh $(echo $GITHUB_REF_NAME | cut -c22-) laravel
