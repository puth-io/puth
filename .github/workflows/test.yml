name: Tests

on:
  workflow_call:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-puth-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 24
    name: puth | node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node-version }}'
      - id: cache
        uses: actions/cache@v4
        with:
          key: node-${{ hashFiles('**/package-lock.json') }}
          path: |
            /home/runner/.npm
            workspaces/puth/.cache
      - name: install & build
        run: |
          npm ci
          npm run build
      - name: download browser
        run: npm run ci:browser:install --workspace workspaces/puth
      - name: test
        run: npm run test --workspace workspaces/puth

  # Every supported LTS line and the newest release, except 24, which test-puth-node tests. Update the list with the
  # schedule at https://github.com/nodejs/Release.
  test-puth-node-versions:
    needs: [ test-puth-node ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 26
    name: puth | node ${{ matrix.node-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node-version }}'
      - id: cache
        uses: actions/cache@v4
        with:
          key: node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
          path: |
            /home/runner/.npm
            workspaces/puth/.cache
      - name: install & build
        run: |
          npm ci
          npm run build
      - name: download browser
        run: npm run ci:browser:install --workspace workspaces/puth
      - name: test
        run: npm run test --workspace workspaces/puth

  php:
    needs: [ test-puth-node ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [ 8.3, 8.4, 8.5 ]
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: cache-npm
        uses: actions/cache@v4
        with:
          key: node-${{ hashFiles('**/package-lock.json') }}
          path: |
            /home/runner/.npm
            workspaces/puth/.cache
      - id: cache-composer
        uses: actions/cache@v4
        with:
          key: composer-php-${{ matrix.php }}-composer-${{ hashFiles('workspaces/clients/php/client/composer.json') }}
          path: /root/.cache/composer/files
      - name: setup php & composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, libxml, mbstring, intl, zip, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: composer update
        working-directory: workspaces/clients/php/client
        run: composer update --prefer-stable --no-interaction --no-suggest
      - name: install & build
        run: |
          npm ci
          npm run build
      - name: download browser
        run: npm run ci:browser:install --workspace workspaces/puth
      - name: test
        run: |
          node dev/fixtures/server.mjs &
          npm -w puth run ci:server &
          timeout 10 bash -c 'until $(curl --output /dev/null --silent --fail http://127.0.0.1:7345); do printf "." && sleep 1; done'
          cd workspaces/clients/php/client && ./vendor/bin/phpunit

  java:
    name: ${{ matrix.name }}
    needs: [ test-puth-node ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The client depends on Spring Boot 3, which requires Java 17.
          - name: java-client | Temurin | JDK 17
            client_dir: workspaces/clients/java/client
            java-version: '17'
            distribution: temurin
          - name: java-client | Temurin | JDK 21
            client_dir: workspaces/clients/java/client
            java-version: '21'
            distribution: temurin
          - name: java-client | Temurin | JDK 25
            client_dir: workspaces/clients/java/client
            java-version: '25'
            distribution: temurin
          # The newest release, while it is not an LTS line.
          - name: java-client | Temurin | JDK 27
            client_dir: workspaces/clients/java/client
            java-version: '27'
            distribution: temurin
          - name: java-client | Corretto | JDK 21
            client_dir: workspaces/clients/java/client
            java-version: '21'
            distribution: corretto
          - name: java-client | Liberica | JDK 21
            client_dir: workspaces/clients/java/client
            java-version: '21'
            distribution: liberica
          - name: java-client | Microsoft | JDK 21
            client_dir: workspaces/clients/java/client
            java-version: '21'
            distribution: microsoft
          - name: java-client | Zulu | JDK 21
            client_dir: workspaces/clients/java/client
            java-version: '21'
            distribution: zulu
          - name: java-spring
            client_dir: workspaces/clients/java/workspaces/spring
            java-version: '17'
            distribution: temurin
            # The example depends on the client from this checkout.
            install_client: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: cache-npm
        uses: actions/cache@v4
        with:
          key: node-${{ hashFiles('**/package-lock.json') }}
          path: |
            /home/runner/.npm
            workspaces/puth/.cache
      - name: npm install & build
        run: |
          npm ci
          npm run build
      - name: download browser
        run: npm run ci:browser:install --workspace workspaces/puth
      - name: Set up JDK ${{ matrix.java-version }} (${{ matrix.distribution }})
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: ${{ matrix.distribution }}
          cache: maven
          cache-dependency-path: ${{ matrix.client_dir }}/pom.xml
      - name: test
        run: |
          node dev/fixtures/server.mjs &
          npm -w puth run ci:server &
          timeout 10 bash -c 'until $(curl --output /dev/null --silent --fail http://127.0.0.1:7345); do printf "." && sleep 1; done'
          if [ "${{ matrix.install_client }}" = "true" ]; then
            mvn -f workspaces/clients/java/client/pom.xml --batch-mode --no-transfer-progress install -DskipTests
          fi
          cd ${{ matrix.client_dir }} && mvn --batch-mode --no-transfer-progress test
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Artifact names must not contain "|", which the job names use.
          name: ${{ matrix.install_client && 'java-spring' || 'java-client' }}-${{ matrix.distribution }}-jdk${{ matrix.java-version }}
          path: |
            workspaces/puth/puth.log
            workspaces/puth/puth.cdp.log
            workspaces/puth/storage

  docker:
    needs: [ test-puth-node ]
    name: test image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: cache-npm
        uses: actions/cache@v4
        with:
          key: node-${{ hashFiles('**/package-lock.json') }}
          path: |
            /home/runner/.npm
            workspaces/puth/.cache
      - name: build
        run: |
          npm ci
          npm run build
          ./docker/pack.sh
      - name: download browser
        run: npm run ci:browser:install --workspace workspaces/puth
      - name: build image
        run: docker build -f docker/Dockerfile -t puth-test-image .
      # The release job has no browser on the runner, so only the image may have one here.
      - name: hide runner browser
        run: mv workspaces/puth/.cache "$RUNNER_TEMP/puth-cache"
      - name: test image
        run: ./docker/test-image.sh puth-test-image
      - name: restore runner browser
        if: ${{ always() }}
        run: mv "$RUNNER_TEMP/puth-cache" workspaces/puth/.cache || true
      - name: container logs
        if: ${{ failure() }}
        run: docker logs puth

  laravel:
    needs: [ test-puth-node ]
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: true
      matrix:
        php: [ 8.3, 8.4, 8.5 ]
        laravel: [ '12.*', '13.*' ]
        phpunit: [ 11, 12 ]
        collision: [ 8 ]
        experimental: [ false ]
        exclude:
          - php: 8.3
            laravel: '13.*'
        include:
          # Track Laravel's development branch for the next major release. It has no version of its own, so it is
          # installed as 13.99.0: packages like puth/php, Tinker and Collision accept that, and the code is master.
          - php: 8.4
            laravel: dev-master as 13.99.0
            phpunit: 12
            collision: 8
            experimental: true
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, Phpunit ${{ matrix.phpunit }}, Collision ${{ matrix.collision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: cache-npm
        uses: actions/cache@v4
        with:
          key: node-${{ hashFiles('**/package-lock.json') }}
          path: |
            /home/runner/.npm
            workspaces/puth/.cache
      - id: cache-composer
        uses: actions/cache@v4
        with:
          key: composer-php-${{ matrix.php }}-composer-${{ hashFiles('workspaces/clients/php/client/composer.json') }}
          path: /root/.cache/composer/files
      - name: setup php & composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, libxml, mbstring, intl, zip, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: composer install
        working-directory: workspaces/clients/php/workspaces/laravel
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "phpunit/phpunit:${{ matrix.phpunit }}.*" --no-interaction --no-update --dev
          composer require "nunomaduro/collision:${{ matrix.collision }}.*" --no-interaction --no-update --dev
          composer update --prefer-stable --no-interaction
      - name: npm install & build
        run: |
          npm ci
          npm run build
      - name: download browser
        run: npm run ci:browser:install --workspace workspaces/puth
      - name: test
        run: |
          node dev/fixtures/server.mjs &
          npm -w puth run ci:server &
          cd workspaces/clients/php/workspaces/laravel
          cp .env.example .env
          php artisan serve > storage/logs/server.log 2>&1 &
          timeout 10 bash -c 'until $(curl --output /dev/null --silent --fail http://127.0.0.1:7345); do printf "." && sleep 1; done'
          php artisan migrate --force
          php artisan test --without-tty
        env:
          RUNNING_IN_CI: true
      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laravel-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.phpunit }}-${{ matrix.collision }}
          path: |
            workspaces/clients/php/workspaces/laravel/storage/logs/server.log
            workspaces/clients/php/workspaces/laravel/storage/logs/laravel.log
            workspaces/puth/puth.log
            workspaces/puth/puth.cdp.log
